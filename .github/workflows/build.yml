name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          mv lib /tmp/lib_backup
          mv pubspec.yaml /tmp/pubspec_backup
          flutter create . --project-name kespro_app --org com.kespro.app
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup pubspec.yaml
          cp -r assets android/app/src/main/assets || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kespro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
